<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 610" width="340" height="610" role="img" aria-label="Three machines, each running cflk, connected to each other through Tailscale, ssh, tmux and git. There is no central server."><style>
.bg{fill:#f6f7f9}.lane{fill:none;stroke:#d5d9e0}.card,.box{fill:#fcfcfd;stroke:#b7bdc9}.line{fill:none;stroke:#8d94a3;stroke-width:1.5}
.accent-line{stroke:#0a6fd1}.dash{stroke-dasharray:5 4}.head{fill:#8d94a3}
text{font:13px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#3b4252}
.strong{font-weight:600;fill:#12151c}.muted{fill:#636b7a}.accent{fill:#0a6fd1}.small{font-size:12px}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.code{font-size:11px}
@media (prefers-color-scheme:dark){.bg{fill:#0f1218}.lane{stroke:#262d3b}.card,.box{fill:#161b24;stroke:#363f52}.line{stroke:#6e7688}
.accent-line{stroke:#1a9bff}.head{fill:#6e7688}text{fill:#b4bac8}.strong{fill:#f4f6f9}.muted{fill:#8b93a5}.accent{fill:#1a9bff}}</style><defs><marker id="net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="head"/></marker></defs><rect x="0" y="0" width="340" height="610" class="bg"/><rect x="1" y="1" width="338" height="608" class="lane dash"/><text x="16" y="30" class="mono small muted" text-anchor="start">tailnet (Tailscale)</text><rect x="40" y="60" width="240" height="130" class="card"/><text x="56" y="90" class="mono strong" text-anchor="start">laptop</text><text x="56" y="114" class="mono accent" text-anchor="start">cflk</text><rect x="40" y="246" width="240" height="130" class="card"/><text x="56" y="276" class="mono strong" text-anchor="start">mac-mini</text><text x="56" y="300" class="mono accent" text-anchor="start">cflk</text><rect x="40" y="432" width="240" height="130" class="card"/><text x="56" y="462" class="mono strong" text-anchor="start">omarch01</text><text x="56" y="486" class="mono accent" text-anchor="start">cflk</text><rect x="56" y="500" width="208" height="46" class="box"/><text x="68" y="520" class="strong" text-anchor="start">Job</text><text x="68" y="538" class="muted small" text-anchor="start">agent in tmux</text><path d="M170,190 V246" class="line"/><path d="M170,376 V432" class="line"/><path d="M40,125 H20 V497 H40" class="line"/><text x="182" y="223" class="mono small muted" text-anchor="start">ssh + git</text><text transform="translate(12 311) rotate(-90)" class="mono small muted" text-anchor="middle">ssh + git</text><text x="182" y="409" class="mono small muted" text-anchor="start">ssh + git</text><text x="170" y="594" class="strong small" text-anchor="middle">No Controller, no daemon: every machine is a peer.</text></svg>
