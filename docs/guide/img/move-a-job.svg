<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 750" width="340" height="750" role="img" aria-label="A Job moves from machine A to machine B in five steps: A stops the agent, commits and pushes the branch to B, exports the session over ssh, B imports it with a new session id and resumes the agent. cflk pull brings it back to A."><style>
.bg{fill:#f6f7f9}.lane{fill:none;stroke:#d5d9e0}.card,.box{fill:#fcfcfd;stroke:#b7bdc9}.line{fill:none;stroke:#8d94a3;stroke-width:1.5}
.accent-line{stroke:#0a6fd1}.dash{stroke-dasharray:5 4}.head{fill:#8d94a3}
text{font:13px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#3b4252}
.strong{font-weight:600;fill:#12151c}.muted{fill:#636b7a}.accent{fill:#0a6fd1}.small{font-size:12px}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.code{font-size:11px}
@media (prefers-color-scheme:dark){.bg{fill:#0f1218}.lane{stroke:#262d3b}.card,.box{fill:#161b24;stroke:#363f52}.line{stroke:#6e7688}
.accent-line{stroke:#1a9bff}.head{fill:#6e7688}text{fill:#b4bac8}.strong{fill:#f4f6f9}.muted{fill:#8b93a5}.accent{fill:#1a9bff}}</style><defs><marker id="move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="head"/></marker></defs><rect x="0" y="0" width="340" height="750" class="bg"/><text x="16" y="14" class="mono accent code" text-anchor="start">cflk move &lt;job&gt; --to B</text><rect x="1" y="28" width="338" height="340" class="lane"/><text x="16" y="50" class="mono small muted" text-anchor="start">A · origin</text><rect x="1" y="388" width="338" height="240" class="lane"/><text x="16" y="410" class="mono small muted" text-anchor="start">B · destination</text><rect x="20" y="62" width="300" height="84" class="box"/><text x="34" y="88" class="strong" text-anchor="start">1  Stop</text><text x="34" y="110" class="small" text-anchor="start">the agent</text><rect x="20" y="170" width="300" height="84" class="box"/><text x="34" y="196" class="strong" text-anchor="start">2  Commit + push</text><text x="34" y="218" class="small" text-anchor="start">the branch to B</text><text x="34" y="238" class="mono accent code" text-anchor="start">refs/cflk/&lt;job&gt;/g&lt;gen&gt;</text><rect x="20" y="278" width="300" height="84" class="box"/><text x="34" y="304" class="strong" text-anchor="start">3  Export session</text><text x="34" y="326" class="small" text-anchor="start">over ssh, never in git</text><rect x="20" y="426" width="300" height="84" class="box"/><text x="34" y="452" class="strong" text-anchor="start">4  Import</text><text x="34" y="474" class="small" text-anchor="start">with a new session id</text><rect x="20" y="534" width="300" height="84" class="box"/><text x="34" y="560" class="strong" text-anchor="start">5  Resume</text><text x="34" y="582" class="small" text-anchor="start">the same conversation</text><path d="M170,146 V170" class="line" marker-end="url(#move)"/><path d="M170,254 V278" class="line" marker-end="url(#move)"/><path d="M170,362 V426" class="line dash" marker-end="url(#move)"/><path d="M170,510 V534" class="line" marker-end="url(#move)"/><text x="16" y="650" class="mono small muted" text-anchor="start">and back</text><rect x="20" y="662" width="80" height="40" class="box"/><text x="60" y="687" class="strong" text-anchor="middle">B</text><path d="M100,682 H260" class="line accent-line" marker-end="url(#move)"/><text x="180" y="674" class="mono accent code" text-anchor="middle">cflk pull &lt;job&gt;</text><rect x="260" y="662" width="60" height="40" class="box"/><text x="290" y="687" class="strong" text-anchor="middle">A</text><text x="20" y="732" class="" text-anchor="start">The Job moves to A and keeps running.</text></svg>
