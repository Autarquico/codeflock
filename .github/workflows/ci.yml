name: ci

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

# A new push to a PR cancels the CI of its previous commit. Every other run gets a group of its own:
# a shared group would drop a pending run on main, and a release needs the checks of its exact commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # What a PR has to test. A push (main, next) tests everything: a release needs every check green on
  # its exact commit, whatever the commit touched. In a PR, a change to docs, the site or Markdown only
  # skips the Go jobs (site.yml covers the site), and the macOS jobs run only when the change can behave
  # differently on macOS or the PR has the label ci/macos. A skipped job counts as passed for the
  # required checks of main, so the jobs skip only on an explicit "false": if this job fails, they run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.what.outputs.go }}
      macos: ${{ steps.what.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: what
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            printf 'go=true\nmacos=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Both sides of a rename, NUL-separated: a moved file counts where it was and where it went.
          mapfile -d '' files < <(git diff --name-only -z --no-renames "$BASE...$HEAD")
          go=false; mac=false
          for f in "${files[@]}"; do
            # Only docs, the site and the Markdown at the root are not code: a .md elsewhere can be
            # embedded in the binary (internal/cli/skills).
            if [[ "$f" =~ ^(docs/|site/) || "$f" =~ ^[^/]+\.md$ ]]; then continue; fi
            go=true
            if [[ "$f" =~ darwin|^install\.sh$|^packaging/|^internal/adapters/runtime/tmux/|^internal/adapters/pty/|^internal/attachwindow/|^\.github/workflows/|^go\.(mod|sum)$ ]]; then
              mac=true; continue
            fi
            # A Go file whose old or new content names the OS or carries a build constraint.
            if [[ "$f" == *.go ]]; then
              for side in "$BASE" "$HEAD"; do
                if git cat-file -e "$side:$f" 2>/dev/null; then
                  git show "$side:$f" > "$RUNNER_TEMP/side.go"
                  rc=0; grep -q -E 'darwin|GOOS|keychain|^//go:build' "$RUNNER_TEMP/side.go" || rc=$?
                  case "$rc" in 0) mac=true ;; 1) ;; *) exit "$rc" ;; esac
                fi
              done
            fi
          done
          printf '%s files changed\n' "${#files[@]}"
          # The label is read now, not from the event, so that a re-run after adding it sees it.
          label="$(gh pr view "$PR" --json labels -q '[.labels[].name] | index("ci/macos") != null')"
          macos=false
          if [ "$go" = true ] && { [ "$label" = true ] || [ "$mac" = true ]; }; then macos=true; fi
          printf 'go=%s\nmacos=%s\n' "$go" "$macos" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  unit:
    name: unit (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: make test-race


  unit-macos:
    name: unit (macos-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: make test-race

  integration:
    name: integration (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: git --version && tmux -V
      # Without tmux or git the tests that need them skip; here they must run.
      - run: make test-integration
        env:
          CF_REQUIRE_TMUX: "1"
          CF_REQUIRE_GIT: "1"


  integration-macos:
    name: integration (macos-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: git --version && tmux -V
      # Without tmux or git the tests that need them skip; here they must run.
      - run: make test-integration
        env:
          CF_REQUIRE_TMUX: "1"
          CF_REQUIRE_GIT: "1"

  cross-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: make cross

  govulncheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The installer and the release chain, against an ephemeral key. Registered in
  # packaging/release/required-checks.txt: release.yml refuses to build without it.
  installer:
    name: installer (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-client python3
      - name: Install prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - run: make test-installer


  installer-macos:
    name: installer (macos-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-client python3
      - name: Install prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - run: make test-installer

  # The release workflow is the only place that may touch the signing key.
  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: only release.yml/sign-publish names the release environment or the signing key
        run: |
          # yq (checked against go.sum and the checksum database) reads every job's environment, whatever its YAML form
          bad=""
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            skip=""
            [ "$f" != .github/workflows/release.yml ] || skip=sign-publish
            yq="go run github.com/mikefarah/yq/v4@v4.54.2"
            hits="$(SKIP="$skip" $yq -r '
              .jobs | to_entries | .[] | select(.key != strenv(SKIP))
                | select((.value.environment | (.name // .) | to_json | test("release|[$][{][{]"))
                         or (.value | to_json | contains("CF_RELEASE_SIGNING_KE" + "Y")))
                | .key' "$f")" || exit 1
            top="$($yq -r 'del(.jobs) | to_json | contains("CF_RELEASE_SIGNING_KE" + "Y")' "$f")" || exit 1
            [ "$top" = false ] || hits="$hits workflow-level reference"
            [ -z "$hits" ] || bad="$bad$f:\n$hits\n"
          done
          if [ -n "$bad" ]; then printf 'release custody violated (only release.yml/sign-publish may use the release environment or signing key):\n%b' "$bad" >&2; exit 1; fi
