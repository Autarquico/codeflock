version: "2"

run:
  build-tags: [integration, e2e]

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        # domain: pure entities and rules (spec §32).
        domain:
          list-mode: strict
          files: ["**/internal/domain/**"]
          allow:
            - $gostd
            - github.com/Autarquico/codeflock/internal/domain
            - github.com/oklog/ulid
        # The CLI knows the domain and the doctor: what it cannot reach
        # (the harness adapters, the host) is composed into it by cmd/cflk.
        cli:
          list-mode: strict
          files: ["**/internal/cli/**", "!$test"]
          allow:
            - $gostd
            - github.com/spf13/cobra
            - github.com/Autarquico/codeflock/internal/cli
            - github.com/Autarquico/codeflock/internal/domain
            - github.com/Autarquico/codeflock/internal/buildinfo
            - github.com/Autarquico/codeflock/internal/worker/doctor
        # Adapters implement ports: they know nothing of who calls them.
        adapters:
          list-mode: lax
          files: ["**/internal/adapters/**", "!$test"]
          deny:
            - pkg: github.com/Autarquico/codeflock/internal/worker
              desc: an adapter does not know the Worker that uses it
        # pty runs a command under a pseudo-terminal: the standard library and
        # creack/pty are all it needs, and the only package that links the latter.
        pty:
          list-mode: strict
          files: ["**/internal/adapters/pty/**", "!$test"]
          allow:
            - $gostd
            - github.com/creack/pty
        # Test support is for tests: production code never links it.
        testsupport:
          list-mode: lax
          files: ["$all", "!$test", "!**/internal/testutil/**"]
          deny:
            - pkg: github.com/Autarquico/codeflock/internal/testutil
              desc: test doubles are for tests only
            - pkg: github.com/Autarquico/codeflock/internal/adapters/harness/harnesstest
              desc: the harness contract suite is for tests only
        # The contract suite checks an adapter on its own: no Worker, no fakes of
        # its own.
        harnesstest:
          list-mode: lax
          files: ["**/internal/adapters/harness/harnesstest/**", "!$test"]
          deny:
            - pkg: github.com/Autarquico/codeflock/internal/worker
              desc: the contract suite does not know the Worker
            - pkg: github.com/Autarquico/codeflock/internal/testutil
              desc: the contract suite takes its adapter from the test that runs it
        # The harness port does not know its implementations.
        harnessport:
          list-mode: lax
          files: ["**/internal/adapters/harness/*.go", "!$test"]
          deny:
            - pkg: github.com/Autarquico/codeflock/internal/adapters/harness/localhost
              desc: the port does not know its implementations
            - pkg: github.com/Autarquico/codeflock/internal/adapters/harness/command
              desc: the port does not know its implementations
            - pkg: github.com/Autarquico/codeflock/internal/adapters/harness/harnesstest
              desc: the port does not know its contract suite
        # treedigest/v1 is a format: the standard library is all it needs.
        treedigest:
          list-mode: strict
          files: ["**/internal/support/treedigest/**", "!$test"]
          allow:
            - $gostd
        # redact matches bytes: the standard library is all it needs.
        redact:
          list-mode: strict
          files: ["**/internal/support/redact/**", "!$test"]
          allow:
            - $gostd
        # svcunit installs services; what the daemon they run does is not its business.
        svcunit:
          list-mode: strict
          files: ["**/internal/support/svcunit/**", "!$test"]
          allow:
            - $gostd
            - github.com/Autarquico/codeflock/internal/support/svcunit
            - github.com/Autarquico/codeflock/internal/support/atomicfile
        # A peer runs Jobs on its own: the harness adapters, the leaf utilities and the
        # domain are all it needs. Nothing of the Worker. (Tests may stand real survivors up, e.g. worker/procident.)
        peer:
          list-mode: strict
          files: ["**/internal/peer/**", "!$test"]
          allow:
            - $gostd
            - github.com/Autarquico/codeflock/internal/peer
            - github.com/Autarquico/codeflock/internal/adapters
            - github.com/Autarquico/codeflock/internal/support
            - github.com/Autarquico/codeflock/internal/domain
        # support is the leaf utilities: it never reaches up to the Worker or an
        # adapter, which inject what they know.
        support:
          list-mode: lax
          files: ["**/internal/support/**", "!$test"]
          deny:
            - pkg: github.com/Autarquico/codeflock/internal/worker
              desc: support does not know the Worker; it is given what it needs
            - pkg: github.com/Autarquico/codeflock/internal/adapters
              desc: support does not know the adapters; it is given what it needs
  exclusions:
    presets: [std-error-handling]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/Autarquico/codeflock]
