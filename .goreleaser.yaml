version: 2

project_name: cflk

builds:
  - id: cflk
    main: ./cmd/cflk
    binary: cflk
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Autarquico/codeflock/internal/buildinfo.version={{.Version}}
      - -X github.com/Autarquico/codeflock/internal/buildinfo.commit={{.Commit}}
      - -X github.com/Autarquico/codeflock/internal/buildinfo.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "cflk_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Nothing is checksummed, signed or published here: packaging/release/finalize.sh and release.yml do that.
checksum:
  disable: true

release:
  disable: true

changelog:
  disable: true
